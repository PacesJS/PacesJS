<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trailmap — Source panel</title>
    <script src="26a9d9f4-ce6f-41d6-a866-3f61192876d1"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <!--fonts-->
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <section
        aria-label="Source"
        style="
          font-family: Poppins, ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
          color: #171a3a;
          font-size: 14px;
          line-height: 22px;
          background: #ffffff;
          border-radius: 16px;
          box-shadow:
            0 1px 2px #171a3a0a,
            0 6px 20px -6px #171a3a14;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        "
      >
        <div
          style="
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #e8eaf1;
          "
        >
          <div style="display: flex; align-items: center; gap: 8px">
            <svg
              aria-hidden="true"
              width="18"
              height="18"
              sc-camel-view-box="0 0 24 24"
              fill="none"
              stroke="#5f6580"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
              <path d="M14 3v5h5"></path>
            </svg>
            <span
              style="
                font-size: 12px;
                line-height: 16px;
                color: #5f6580;
                font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
                flex: 1 1 auto;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
              "
              >{{s.path}}</span
            >
            <button
              aria-label="Collapse source panel"
              style="
                width: 44px;
                height: 44px;
                margin: -10px -10px -10px 0;
                border: 0;
                border-radius: 10px;
                background: transparent;
                color: #5f6580;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
              "
            >
              <svg
                aria-hidden="true"
                width="18"
                height="18"
                sc-camel-view-box="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M13 6l6 6-6 6"></path>
                <path d="M5 6l6 6-6 6"></path>
              </svg>
            </button>
          </div>
          <div
            style="
              display: flex;
              flex-wrap: wrap;
              align-items: flex-end;
              justify-content: space-between;
              gap: 12px;
            "
          >
            <div style="display: flex; flex-direction: column">
              <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">
                {{s.fn}}
              </h2>
              <span
                style="
                  font-size: 12px;
                  line-height: 16px;
                  color: #5f6580;
                  font-variant-numeric: tabular-nums;
                "
                >{{s.totals}}</span
              >
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
              <div
                role="img"
                aria-label="{{s.sparkLabel}}"
                style="display: flex; align-items: flex-end; gap: 2px; height: 24px; width: 150px"
              >
                <sc-for list="{{s.spark}}" as="b" hint-placeholder-count="40"
                  ><span style="{{b.style}}"></span
                ></sc-for>
              </div>
              <span style="font-size: 11px; line-height: 14px; color: #5f6580"
                >When it ran on main, 0–42.8 s</span
              >
            </div>
          </div>
        </div>

        <sc-if value="{{s.changed}}" hint-placeholder-val="{{ false }}">
          <div
            role="status"
            style="
              margin: 12px 16px 0;
              padding: 10px 12px;
              border-radius: 10px;
              background: #e3edff;
              color: #1d5ad0;
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              gap: 8px 12px;
              font-size: 13px;
              line-height: 18px;
            "
          >
            <svg
              aria-hidden="true"
              width="16"
              height="16"
              sc-camel-view-box="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 8v5M12 16h.01"></path>
            </svg>
            <span style="flex: 1 1 180px"
              >This file changed since profiling. Lines may not match the run.</span
            >
            <button
              style="
                min-height: 36px;
                padding: 0 12px;
                border: 1px solid #1d5ad0;
                border-radius: 10px;
                background: #ffffff;
                color: #1d5ad0;
                font-family: inherit;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
              "
            >
              Show recorded copy
            </button>
          </div>
        </sc-if>

        <div style="overflow-x: auto; padding: 8px 0 12px">
          <ol
            aria-label="Source lines with self time"
            style="
              list-style: none;
              margin: 0;
              padding: 0;
              min-width: 400px;
              font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
              font-size: 12.5px;
              line-height: 26px;
            "
          >
            <sc-for list="{{s.lines}}" as="ln" hint-placeholder-count="12">
              <li style="{{ln.rowStyle}}">
                <span
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: flex-end;
                    gap: 4px;
                    padding-right: 6px;
                  "
                >
                  <span
                    style="
                      font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
                      font-size: 11px;
                      line-height: 14px;
                      font-weight: 600;
                      color: #171a3a;
                      font-variant-numeric: tabular-nums;
                    "
                    >{{ln.val}}</span
                  >
                  <span aria-hidden="true" style="{{ln.barStyle}}"></span>
                </span>
                <span
                  style="
                    color: #5f6580;
                    text-align: right;
                    padding-right: 12px;
                    font-variant-numeric: tabular-nums;
                  "
                  >{{ln.n}}</span
                >
                <span style="white-space: pre; min-width: 0"
                  ><sc-for list="{{ln.segs}}" as="sg" hint-placeholder-count="3"
                    ><span style="{{sg.style}}">{{sg.t}}</span></sc-for
                  ><sc-if value="{{ln.hasChip}}" hint-placeholder-val="{{ false }}"
                    ><button style="{{ln.chipStyle}}">
                      <span aria-hidden="true" style="{{ln.chipDot}}"></span>{{ln.chip}}
                    </button></sc-if
                  ></span
                >
              </li>
            </sc-for>
          </ol>
        </div>
        <p
          style="
            margin: 0;
            padding: 12px 20px 16px;
            border-top: 1px solid #e8eaf1;
            font-size: 12px;
            line-height: 16px;
            color: #5f6580;
          "
        >
          Bars = self time on each line, from V8 line ticks. Chips = time spent in the callee from
          that line; select one to follow it.
        </p>
      </section>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script=""
      data-props='{"fn":{"editor":"enum","options":["loadTemplate","buildInvoiceRows"],"default":"loadTemplate"},"$preview":{"width":440,"height":1000}}'
    >
      class Component extends DCLogic {
        renderVals() {
          var COL = { kw: '#a31b91', str: '#0a7a4d', fn: '#1d5ad0', p: '#171a3a' };
          var ORG = { you: '#ff8a1f', dep: '#4c8dff', node: '#1bb5a2', native: '#2bc48a' };
          function tok(src) {
            var re = /('[^']*'|\/[^\/]+\/g)|\b(export|function|const|let|if|return|for|of|new|true|false)\b|([A-Za-z_$][\w$]*)(?=\()/g;
            var out = [], last = 0, m;
            while ((m = re.exec(src)) !== null) {
              if (m.index > last) out.push({ t: src.slice(last, m.index), k: 'p' });
              out.push({ t: m[0], k: m[1] ? 'str' : (m[2] ? 'kw' : 'fn') });
              last = re.lastIndex;
            }
            if (last < src.length) out.push({ t: src.slice(last), k: 'p' });
            return out.map(function (s) { return { t: s.t, style: 'color: ' + COL[s.k] + (s.k === 'kw' ? '; font-weight: 600' : '') }; });
          }
          function build(lines, maxSelf) {
            var hot = lines.reduce(function (a, l) { return (l[2] || 0) > (a[2] || 0) ? l : a; }, lines[0]);
            return lines.map(function (l) {
              var self = l[2] || 0, isHot = l === hot;
              var w = self > 0 ? Math.max(3, Math.round(self / maxSelf * 52)) : 0;
              return {
                n: l[0], segs: tok(l[1]),
                val: isHot ? '~' + self + ' ms' : '',
                rowStyle: 'display: grid; grid-template-columns: 112px 36px minmax(0, 1fr); align-items: center; padding-right: 16px;' + (isHot ? ' background: #ffebd6; box-shadow: inset 3px 0 0 #ff8a1f;' : ''),
                barStyle: 'display: block; height: 10px; border-radius: 3px; width: ' + w + 'px; background: #ff8a1f',
                hasChip: !!l[3],
                chip: l[3] ? l[3][0] : '',
                chipDot: l[3] ? 'width: 8px; height: 8px; border-radius: 9999px; background: ' + ORG[l[3][1]] : '',
                chipStyle: 'display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; min-height: 22px; padding: 0 8px; border: 1px solid #e8eaf1; border-radius: 6px; background: #ffffff; color: #171a3a; font-family: Poppins, ui-sans-serif, system-ui, sans-serif; font-size: 11px; line-height: 16px; font-weight: 600; vertical-align: middle; cursor: pointer'
              };
            });
          }
          function spark(seed, label) {
            var s = seed, out = [];
            for (var i = 0; i < 40; i++) {
              s = (s * 16807) % 2147483647;
              var r = (s - 1) / 2147483646;
              var h = i < 2 ? 0 : (r > 0.35 ? 4 + Math.round(r * 18) : 2);
              if (i === 17) h = 24;
              out.push({ style: 'flex: 1 1 0; border-radius: 2px; height: ' + h + 'px; background: ' + (i === 17 ? '#ff8a1f' : 'rgba(255,138,31,0.45)') });
            }
            return out;
          }
          var data = {
            loadTemplate: {
              path: 'src/render/template.ts', fn: 'loadTemplate', totals: '~267 ms total · ~9 ms self · ~7 calls est.', changed: false,
              sparkLabel: 'Ran in every GET /orders request, busiest around 18 s', spark: spark(11),
              lines: build([
                [36, "const cache = new Map<string, Template>();"],
                [37, ''],
                [38, 'export function loadTemplate(name: string) {', 0.3],
                [39, "  const file = path.join(TEMPLATES_DIR, name + '.hbs');", 1.1, ['path.join ~2 ms', 'node']],
                [40, '  if (cache.has(file) && !DEV) {', 0.4],
                [41, '    return cache.get(file);'],
                [42, '  }'],
                [43, "  const raw = fs.readFileSync(file, 'utf8');", 5.8, ['fs.readFileSync ~250 ms', 'node']],
                [44, '  const tpl = compile(raw, { strict: true });', 0.9, ['compile ~6 ms', 'dep']],
                [45, '  cache.set(file, tpl);', 0.4],
                [46, '  return tpl;', 0.1],
                [47, '}'],
                [48, ''],
                [49, "export const DEV = process.env.NODE_ENV !== 'production';"]
              ], 5.8)
            },
            buildInvoiceRows: {
              path: 'src/render/invoice.ts', fn: 'buildInvoiceRows', totals: '~674 ms total · ~296 ms self · ~7 calls est.', changed: true,
              sparkLabel: 'Ran in every GET /orders request, busiest around 18 s', spark: spark(23),
              lines: build([
                [71, 'export function buildInvoiceRows(order: Order) {'],
                [72, '  const rows: Row[] = [];'],
                [73, '  for (const item of order.items) {', 14],
                [74, '    validateItem(item);', 3, ['ajv ▸ validate ~128 ms', 'dep']],
                [75, '    const total = lineTotal(item, order.currency);', 4, ['lineTotal ~180 ms', 'you']],
                [76, '    rows.push({', 6],
                [77, '      sku: item.sku,', 2],
                [78, "      label: item.title.trim().replace(/\\s+/g, ' '),", 52],
                [79, '      price: formatCurrency(item.price, order.currency),', 3, ['formatCurrency ~36 ms', 'you']],
                [80, '      total: formatCurrency(total, order.currency),', 3, ['formatCurrency ~34 ms', 'you']],
                [81, "      tags: item.tags.filter((t) => !HIDDEN.includes(t)).join(', '),", 188],
                [82, '    });'],
                [83, '  }'],
                [84, '  return rows.sort((a, b) => a.sku.localeCompare(b.sku));', 21],
                [85, '}']
              ], 188)
            }
          };
          var fn = this.props.fn || 'loadTemplate';
          return { s: data[fn] || data.loadTemplate };
        }
      }
    </script>
  </body>
</html>
