name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --continue
      - run: node --test scripts/next-version.test.mjs

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Require an npm that supports trusted publishing
        run: |
          v=$(npm --version)
          node -e "const [M,m,p]='$v'.split('.').map(Number); if (M<11||(M===11&&(m<5||(m===5&&p<1)))) { console.error('::error::npm $v cannot publish with trusted publishing; 11.5.1 or newer is needed.'); process.exit(1); }"
      - run: pnpm install --frozen-lockfile
      - name: Choose the version
        id: version
        run: echo "value=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"
      - name: Set the version
        working-directory: packages/paces
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
      - run: pnpm build
      - name: Publish (trusted publishing, no token)
        working-directory: packages/paces
        run: npm publish --access public
